name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  TZ: Europe/Ljubljana
  JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Ljubljana

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Lint frontend
        working-directory: frontend-fm
        run: |
          npm ci
          npm run lint

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend-fm/pom.xml

      - name: Lint backend
        working-directory: backend-fm
        run: >-
          bash ./mvnw -B
          org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
          -Dcheckstyle.config.location=config/checkstyle.xml

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Build frontend
        working-directory: frontend-fm
        run: |
          npm ci
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend-fm/pom.xml

      - name: Build backend
        working-directory: backend-fm
        run: bash ./mvnw -B package -DskipTests

      - name: Collect build artifacts
        run: |
          mkdir -p build-artifacts/frontend build-artifacts/backend
          cp -R frontend-fm/dist build-artifacts/frontend/dist
          cp backend-fm/target/backend-fm-*.jar build-artifacts/backend/

      - name: Prepare production image contexts
        run: |
          cp frontend-fm/Dockerfile.production build-artifacts/frontend/Dockerfile
          cp frontend-fm/nginx.conf.template build-artifacts/frontend/nginx.conf.template
          cp backend-fm/Dockerfile.production build-artifacts/backend/Dockerfile

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: build-artifacts
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production images
        uses: docker/build-push-action@v6
        with:
          context: build-artifacts/backend
          file: build-artifacts/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/femto-manage-backend:${{ github.sha }}

      - name: Build and publish frontend production image
        uses: docker/build-push-action@v6
        with:
          context: build-artifacts/frontend
          file: build-artifacts/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/femto-manage-frontend:${{ github.sha }}

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-fm/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend-fm/pom.xml

      - name: Test backend with coverage
        working-directory: backend-fm
        run: >-
          bash ./mvnw -B
          org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent
          test
          org.jacoco:jacoco-maven-plugin:0.8.13:report

      - name: Install frontend dependencies
        working-directory: frontend-fm
        run: npm ci

      - name: Prepare Maven wrapper for isolated tests
        run: chmod +x backend-fm/mvnw

      - name: Install Playwright browser
        working-directory: frontend-fm
        run: npx playwright install --with-deps chromium

      - name: Test frontend end to end
        working-directory: frontend-fm
        run: npm run test:e2e:isolated

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            backend-fm/target/site/jacoco
            backend-fm/target/surefire-reports
            frontend-fm/playwright-report
            frontend-fm/test-results
          if-no-files-found: warn

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: application-build
          path: build-artifacts

      - name: Verify downloaded build artifacts
        run: |
          test -d build-artifacts/frontend/dist
          test -f build-artifacts/frontend/Dockerfile
          test -f build-artifacts/frontend/nginx.conf.template
          test -d build-artifacts/backend
          test -f build-artifacts/backend/Dockerfile
          test -n "$(find build-artifacts/backend -maxdepth 1 -name 'backend-fm-*.jar' -print -quit)"

      - name: Deploy backend to Render
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/femto-manage-backend:${{ github.sha }}
        run: |
          test -n "$RENDER_BACKEND_DEPLOY_HOOK"
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=$BACKEND_IMAGE" \
            "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Deploy frontend to Render
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/femto-manage-frontend:${{ github.sha }}
        run: |
          test -n "$RENDER_FRONTEND_DEPLOY_HOOK"
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=$FRONTEND_IMAGE" \
            "$RENDER_FRONTEND_DEPLOY_HOOK"
